@if (confirmacion(); as item) {
  <section
    class="action-confirmation-shell"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <div class="action-confirmation-card">
      <button
        type="button"
        class="action-confirmation-close"
        aria-label="Cerrar confirmacion"
        (click)="cerrar()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7l10 10M17 7L7 17" />
        </svg>
      </button>

      <div class="action-confirmation-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>

      <p class="action-confirmation-title">{{ item.titulo }}</p>
      <p class="action-confirmation-message">{{ item.mensaje }}</p>
      <div class="action-confirmation-progress" aria-hidden="true"></div>
    </div>
  </section>
}
