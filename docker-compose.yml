services:
  db:
    image: postgres:16-alpine
    container_name: logistica_porvenir_db
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insumos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

  backend:
    build:
      context: ./BACKEND
    container_name: logistica_porvenir_backend
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

  frontend:
    build:
      context: ./FRONTEND
    container_name: logistica_porvenir_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

networks:
  logistica_porvenir_net:
    driver: bridge

volumes:
  postgres_data:
