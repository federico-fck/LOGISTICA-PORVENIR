services:
  db:
    image: postgres:16-alpine
    container_name: logistica_porvenir_db
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./BASE DE DATOS/insumos_dbeaver_actual.pg16.sql:/docker-entrypoint-initdb.d/01-insumos-dbeaver-actual.sql:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

  backend:
    build:
      context: ./BACKEND
    container_name: logistica_porvenir_backend
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

  frontend:
    build:
      context: ./FRONTEND
    container_name: logistica_porvenir_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - logistica_porvenir_net

networks:
  logistica_porvenir_net:
    driver: bridge

volumes:
  postgres_data:
